# ctwatch configuration.
#
# The watchlist below is a starting point, not a recommendation: it covers
# organisations whose impersonation is already public record, so that a new
# installation does something useful before anyone has typed a domain name.
# Cut it down to what you actually care about. Every target costs one request
# per scan, and generating candidates for seventy of them will exhaust a free
# API quota long before the scan finishes.
#
# The practical shape of it:
#   - a handful of targets you follow closely  -> `ctwatch scan --variants 200`
#   - a long list you want covered broadly     -> `ctwatch monitor`, which
#     checks every certificate that goes past against the whole list for free.
#
# `allowlist` is not optional in practice: large newsrooms register dozens of
# defensive lookalike domains themselves. Subdomains of a watched domain are
# never reported — they are the brand's own site — but a separate registration
# the brand owns has to be declared here or recognised through a shared
# certificate.

