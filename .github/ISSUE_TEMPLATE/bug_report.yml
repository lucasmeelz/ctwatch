name: Bug report
description: Something behaves differently from what the documentation says.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If ctwatch contacted a domain it was investigating, please do not open a
        public issue. Report it privately — see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The command you ran and what it did.
      placeholder: |
        uv run ctwatch scan --target example.fr --variants 50
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ctwatch version
      description: Output of `uv run ctwatch version`.
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and operating system
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: >
        Re-run with `--json` if you can. Please remove anything you would rather
        not publish, including the domains you are watching.
      render: shell
